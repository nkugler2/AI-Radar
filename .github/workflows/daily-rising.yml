name: AI Radar — Daily Rising

on:
  schedule:
    - cron: "0 6 * * 1-6"   # Mon–Sat at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Same cache as weekly-deep.yml, on purpose. GitHub evicts caches after
      # 7 days without a read, and the deep cron is exactly 7 days — a coin
      # flip on eviction every week. The daily job touching this key keeps the
      # deep pass's README cache alive, and the rising pass gets to reuse it too.
      - name: Restore DuckDB README cache
        uses: actions/cache@v4
        with:
          path: data/ai_radar.duckdb
          key: ai-radar-duckdb-${{ github.run_id }}
          restore-keys: |
            ai-radar-duckdb-

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv python install 3.12

      - run: uv sync --frozen

      - name: Run pipeline (rising only)
        env:
          GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: uv run python main.py --mode rising_only

      - name: Commit updated Parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/repos.parquet data/snapshots.parquet
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: auto-update parquet (rising) [skip ci]"
            git pull --rebase origin master
            git push
          fi
