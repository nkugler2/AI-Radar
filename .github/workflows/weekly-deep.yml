name: AI Radar — Weekly Deep

on:
  schedule:
    - cron: "0 6 * * 0"     # Sunday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv python install 3.12

      - run: uv sync --frozen

      - name: Run pipeline (deep)
        env:
          GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: uv run python main.py --mode deep_only

      - name: Commit updated Parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/repos.parquet
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: auto-update repos.parquet (deep) [skip ci]"
            git push
          fi
